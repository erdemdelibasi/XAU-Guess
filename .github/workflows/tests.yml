name: Tests

on:
  push:
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # No secrets needed -- every test covers a pure decision function and
      # none of them touch Supabase, Yahoo, Binance or Anthropic.
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v
