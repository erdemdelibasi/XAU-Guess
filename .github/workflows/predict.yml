name: Daily Prediction

# COMEX gold settles at 17:00 New York, which is 21:00 UTC in summer and
# 22:00 in winter. 23:00 UTC is safely after both, all year, without needing
# a daylight-saving rule. Weekdays only -- there is no Saturday gold close to
# predict against, and predict.py would skip the run anyway once it saw the
# session had not advanced.
on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

# New repos default the GITHUB_TOKEN to read-only. Without this the commit
# step's `git push` fails with "Write access to repository not granted" /
# 403 -- caught on daily_retrain.yml's first real run (2026-09-07); this
# workflow has the identical commit step and would fail the same way the
# first time it actually bootstrap-trains a model.
permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run prediction
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional. Without it the `claude` component stays neutral and
          # everything else runs unchanged -- see claude_signal.py.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python predict.py

      # The ETF trackers (assets.TRACKED), in the same job rather than a
      # separate workflow: they read closed sessions from the same afternoon,
      # touch no model and no LLM, and take seconds. A second cron would be a
      # second thing to notice when it silently stops.
      #
      # `if: always()` so a failure in the prediction above -- a dead Yahoo
      # series, a missing model -- does not also stop the books that have
      # nothing to do with it. ETFs settle 16:00 New York, three hours before
      # this workflow runs, so the session it reads is long closed.
      - name: Update tradeable-ETF books
        if: always()
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python track_etf.py

      # The breakout panel's state (order flow / anchored VWAP / volume
      # profile). Same job and same `if: always()` reasoning as the ETF books
      # above: price and volume history only, seconds to run, and nothing
      # downstream of it. It reads COMEX:GC1!/SI1! from TradingView rather
      # than from Yahoo, because Yahoo cannot serve those contracts' volume
      # and the whole panel is volume -- research/flow.py part 0. That is an
      # undocumented WebSocket, so tv_history.daily() returns an empty frame
      # instead of raising and this step degrades to "stale panel".
      #
      # It trades nothing: the rule did not clear its pre-registered bar
      # (research/README.md section 18), so there is no `breakout` portfolio
      # and a failure here costs a stale panel, not a missed decision.
      - name: Update breakout panel state
        if: always()
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python track_breakout.py

      # predict.py bootstrap-trains a model when none exists or the feature
      # set changed. Without this commit that model is discarded when the
      # runner shuts down, and every single run pays to retrain from scratch.
      - name: Commit bootstrap-trained model if it changed
        run: |
          if [[ -n "$(git status --porcelain backend/models/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/models/
            git commit -m "chore: bootstrap-trained model(s)"
            git push
          else
            echo "No model change to commit."
          fi
