name: Backtest

# Manual only. This replays ~4900 sessions across four cost scenarios and
# takes several minutes; it answers a question ("did a parameter change help")
# that is asked deliberately, not on a schedule.
on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # No Supabase secrets: the backtest reads market data and writes
      # nothing. Keeping credentials out of this job makes that guarantee
      # structural rather than a promise in a docstring.
      - name: Run backtest
        working-directory: backend
        run: python backtest.py
