name: Daily Retrain

# After predict.yml (23:00 UTC) so the day's row is already resolved and
# counted before the component records are rebuilt from it.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

# New repos default the GITHUB_TOKEN to read-only. Without this the commit
# step's `git push` fails with "Write access to repository not granted" /
# 403 -- caught live on the first real run (2026-09-07).
permissions:
  contents: write

jobs:
  # Stand-down gate. Since 2026-10-05 the PRIMARY trigger is a
  # workflow_dispatch from the user's machine (Task Scheduler "XAU-Guess
  # Retrain Trigger", daily 04:30 TR = this cron's 01:30 UTC), because the
  # cron had drifted to starting at 06:39-07:17 UTC. The cron stays as the
  # fallback for a night that machine is off. Only a SCHEDULED run checks,
  # and it looks only for DISPATCHED runs; backend/trigger_workflow.ps1
  # guards the other order and replays this rule, so the 12 hours must match
  # its -WindowHours. A second run would be harmless (retrain.py is
  # idempotent) but wasted, and a second commit.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Stand down if this slot was already dispatched
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w daily_retrain.yml --event workflow_dispatch -L 20 \
                --json createdAt,conclusion \
                --jq "[.[] | select(.createdAt >= \"$cutoff\" and .conclusion != \"failure\" and .conclusion != \"cancelled\")] | length")
          echo "dispatched daily_retrain.yml runs since $cutoff: $n"
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Standing down: this slot was dispatched from the user's machine."
          fi

  retrain:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Retrain and rebuild component records
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python retrain.py

      # BOTH files, every time. XRP-Guess shipped a version of this that
      # committed the model and forgot calibration.joblib: retrain.py refit
      # the calibrators nightly, the runner then deleted them, and the
      # "daily self-improvement" loop silently never happened.
      - name: Commit refreshed model and calibrators
        run: |
          if [[ -n "$(git status --porcelain backend/models/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/models/
            git commit -m "chore: nightly model + calibration refresh"
            git push
          else
            echo "No model change to commit."
          fi
